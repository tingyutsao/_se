<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6fb">
  <meta name="description" content="用 AI 選擇題測試自己,再用閃卡複習 StudyBox 筆記重點。">
  <title>測驗與閃卡 · StudyBox</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%236d6bff'/%3E%3Cstop offset='1' stop-color='%23a855f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='18' fill='url(%23g)'/%3E%3Cpath d='M17 21c0-3 2-5 5-5h25v30H22c-3 0-5 2-5 5V21Z' fill='none' stroke='white' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M22 47h25M26 26h13M26 33h9' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body data-page="study">
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/index.html" aria-label="StudyBox 首頁">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 4.5A2.5 2.5 0 0 1 7.5 2H20v17H7.5A2.5 2.5 0 0 0 5 21.5V4.5Z"/>
            <path d="M5 18.5A2.5 2.5 0 0 1 7.5 16H20"/>
            <path d="M9 6.5h7M9 10h5"/>
          </svg>
        </span>
        <span class="brand-text">
          <strong>StudyBox</strong>
          <small>AI 讀書助手</small>
        </span>
      </a>

      <nav class="main-nav" aria-label="主要導覽">
        <a class="nav-link" href="/index.html" data-nav="notes">筆記庫</a>
        <a class="nav-link" href="/study.html" data-nav="study">測驗與閃卡</a>
        <a class="nav-link" href="/stats.html" data-nav="stats">學習統計</a>
      </nav>

      <div class="header-actions">
        <a class="btn btn-primary btn-sm header-cta" href="/index.html?new=1">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          新增筆記
        </a>
      </div>
    </div>
  </header>

  <main>
    <section class="container page-hero">
      <div>
        <p class="eyebrow">Focus Mode</p>
        <h1>測驗與閃卡</h1>
        <p>先做一輪選擇題找出盲點,再翻閃卡把關鍵概念記牢。每一題、每一張卡都會累積成你的學習軌跡。</p>
      </div>
      <div class="page-hero-actions">
        <a class="btn btn-ghost" href="/stats.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V4"/><path d="M4 20h16"/><path d="M8 16v-5M12.5 16V7M17 16v-3"/></svg>
          查看統計
        </a>
      </div>
    </section>

    <section class="container study-layout">
      <aside class="panel note-picker" aria-label="選擇筆記">
        <div class="panel-head">
          <h2>我的筆記</h2>
          <span id="studyNoteCount"></span>
        </div>
        <div class="note-list" id="studyNoteList"></div>
        <div class="note-picker-empty" id="studyNotePickerEmpty" hidden>還沒有筆記,先到筆記庫新增一篇。</div>
      </aside>

      <div class="study-main">
        <div class="mobile-note-select">
          <label for="studyNoteSelect">切換筆記</label>
          <select id="studyNoteSelect" aria-label="切換筆記"></select>
        </div>

        <div class="panel" id="studyLoading">
          <div class="mini-empty"><span class="spinner"></span>&nbsp;正在整理你的筆記…</div>
        </div>

        <div class="panel empty-state" id="studyEmpty" hidden>
          <div class="empty-illustration" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5A2.5 2.5 0 0 1 7.5 2H20v17H7.5A2.5 2.5 0 0 0 5 21.5V4.5Z"/><path d="M5 18.5A2.5 2.5 0 0 1 7.5 16H20"/><path d="M9 6.5h7M9 10h5"/></svg>
          </div>
          <h3>先新增一篇筆記</h3>
          <p>有了筆記,AI 才能幫你出題與製作閃卡。建立後回到這裡,就能開始測驗。</p>
          <a class="btn btn-primary" href="/index.html?new=1">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            新增筆記
          </a>
        </div>

        <div class="study-workspace" id="studyWorkspace" hidden>
          <section class="panel study-head">
            <div class="study-title-row">
              <div class="study-title-copy">
                <span class="subject-pill" id="studySubject"></span>
                <h2 id="studyTitle"></h2>
                <p class="meta" id="studyMeta"></p>
              </div>
              <div class="study-ai-actions">
                <button class="btn btn-soft" type="button" id="btnSummary">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.4 4.1L17.5 8.5l-4.1 1.4L12 14l-1.4-4.1L6.5 8.5l4.1-1.4L12 3Z"/><path d="M18.5 14l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2Z"/></svg>
                  AI 摘要
                </button>
                <button class="btn btn-soft" type="button" id="btnQuestions">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1.2 1.2L7 5"/><path d="m3.5 12 1.2 1.2L7 11"/><path d="m3.5 18 1.2 1.2L7 17"/></svg>
                  AI 出題
                </button>
                <button class="btn btn-soft" type="button" id="btnCards">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="12" height="16" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg>
                  生成閃卡
                </button>
              </div>
            </div>

            <div class="study-summary" id="studySummaryBox" hidden>
              <div class="study-summary-head">
                <span class="ai-badge">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.4 4.1L17.5 8.5l-4.1 1.4L12 14l-1.4-4.1L6.5 8.5l4.1-1.4L12 3Z"/><path d="M18.5 14l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2Z"/></svg>
                  AI 摘要
                </span>
              </div>
              <p id="studySummaryText"></p>
              <div class="tag-row" id="studySummaryTags"></div>
            </div>

            <details class="note-preview" id="studyPreview">
              <summary>查看原始筆記內容</summary>
              <div class="prose" id="studyContent"></div>
            </details>
          </section>

          <section class="panel workspace">
            <div class="tab-bar" role="tablist" aria-label="學習模式">
              <button class="tab" id="tabQuiz" type="button" role="tab" aria-selected="true" aria-controls="quizPane" data-tab="quiz">
                選擇題
                <span class="count-badge" id="quizCount">0</span>
              </button>
              <button class="tab" id="tabCards" type="button" role="tab" aria-selected="false" aria-controls="cardsPane" data-tab="cards">
                閃卡
                <span class="count-badge" id="cardsCount">0</span>
              </button>
            </div>
            <div class="tab-panel" id="quizPane" role="tabpanel" aria-labelledby="tabQuiz">
              <div class="quiz-stage" id="quizStage"></div>
            </div>
            <div class="tab-panel" id="cardsPane" role="tabpanel" aria-labelledby="tabCards" hidden>
              <div class="cards-stage" id="cardsStage"></div>
            </div>
          </section>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5A2.5 2.5 0 0 1 7.5 2H20v17H7.5A2.5 2.5 0 0 0 5 21.5V4.5Z"/><path d="M5 18.5A2.5 2.5 0 0 1 7.5 16H20"/></svg>
        </span>
        StudyBox · 用 AI 把筆記變成實力
      </div>
      <div class="footer-links">
        <a href="/index.html">筆記庫</a>
        <a href="/stats.html">學習統計</a>
        <span>Built on Cloudflare Workers</span>
      </div>
    </div>
  </footer>

  <nav class="mobile-nav" aria-label="行動版導覽">
    <a href="/index.html" data-nav="notes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5A2.5 2.5 0 0 1 7.5 2H20v17H7.5A2.5 2.5 0 0 0 5 21.5V4.5Z"/><path d="M5 18.5A2.5 2.5 0 0 1 7.5 16H20"/></svg>
      筆記庫
    </a>
    <a href="/study.html" data-nav="study">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1.2 1.2L7 5"/><path d="m3.5 12 1.2 1.2L7 11"/><path d="m3.5 18 1.2 1.2L7 17"/></svg>
      測驗複習
    </a>
    <a href="/stats.html" data-nav="stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V4"/><path d="M4 20h16"/><path d="M8 16v-5M12.5 16V7M17 16v-3"/></svg>
      學習統計
    </a>
  </nav>

  <div class="toast-root" id="toastRoot" aria-live="polite" aria-atomic="false"></div>
  <script src="/app.js" defer></script>
</body>
</html>
