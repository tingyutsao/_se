<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>金門大學 校務系統（模擬示範版）</title>
<style>
:root{
  --navy:#1b3a6b; --navy-2:#26508f; --navy-3:#eef3fa;
  --gold:#c8a04a; --gold-2:#f3e6c8;
  --ink:#1f2733; --muted:#6b7686; --line:#dfe4ec; --bg:#f4f6f9;
  --ok:#1a7f4b; --warn:#b26a00; --bad:#c0392b; --info:#1c6ea4;
  --r:8px; --sh:0 1px 3px rgba(20,35,60,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Microsoft JhengHei","微軟正黑體","PingFang TC","Heiti TC",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.6;
}
a{color:var(--navy-2);text-decoration:none}
button{font-family:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}

/* ---------- 登入 ---------- */
#login{min-height:100vh;display:grid;place-items:center;padding:24px;
  background:linear-gradient(160deg,#16325c 0%,#26508f 55%,#3a6bb0 100%)}
.login-box{width:100%;max-width:400px;background:#fff;border-radius:14px;
  box-shadow:0 18px 50px rgba(10,25,50,.35);overflow:hidden}
.login-head{background:var(--navy);color:#fff;padding:26px 24px;text-align:center;
  border-bottom:3px solid var(--gold)}
.login-head h1{margin:0;font-size:20px;letter-spacing:2px}
.login-head .sub{margin-top:6px;font-size:12px;color:#c9d8ef}
.login-body{padding:24px}
.login-body label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
.login-body input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px}
.login-body input:focus{outline:2px solid var(--navy-3);border-color:var(--navy-2)}
.btn{width:100%;margin-top:22px;padding:11px;border:0;border-radius:6px;cursor:pointer;
  background:var(--navy);color:#fff;font-size:15px;letter-spacing:1px}
.btn:hover{background:var(--navy-2)}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--navy-2)}
.login-msg{margin-top:14px;padding:9px 12px;border-radius:6px;font-size:13px;display:none}
.login-msg.err{display:block;background:#fdeceb;color:var(--bad);border:1px solid #f6c9c4}
.login-msg.ok{display:block;background:#e9f7ef;color:var(--ok);border:1px solid #bfe6cd}
.demo-box{margin-top:18px;border-top:1px dashed var(--line);padding-top:14px;font-size:12px;color:var(--muted)}
.demo-box b{color:var(--ink)}
.demo-box button{margin-top:6px;width:100%;padding:7px;border:1px solid var(--line);border-radius:6px;
  background:#fafbfd;cursor:pointer;font-size:12px;color:var(--navy-2)}
.demo-box button:hover{background:var(--navy-3)}

/* ---------- 框架 ---------- */
#app{display:none}
header.bar{background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;
  padding:0 18px;height:54px;box-shadow:var(--sh);position:sticky;top:0;z-index:20}
header.bar .logo{font-size:16px;font-weight:bold;letter-spacing:2px;white-space:nowrap}
header.bar .logo span{color:var(--gold)}
header.bar .semester{margin-left:6px;padding:3px 10px;border:1px solid #4d6ea3;border-radius:999px;
  font-size:12px;color:#d8e3f4;white-space:nowrap}
header.bar .spacer{flex:1}
header.bar .who{font-size:13px;color:#d8e3f4;white-space:nowrap}
header.bar .who b{color:#fff}
header.bar button.out{padding:6px 12px;border:1px solid #4d6ea3;background:transparent;color:#d8e3f4;
  border-radius:6px;cursor:pointer;font-size:13px}
header.bar button.out:hover{background:#26457a;color:#fff}
nav.tabs{background:#fff;border-bottom:1px solid var(--line);display:flex;gap:2px;
  padding:0 12px;overflow-x:auto;position:sticky;top:54px;z-index:19}
nav.tabs button{border:0;background:transparent;padding:12px 16px;cursor:pointer;color:var(--muted);
  border-bottom:3px solid transparent;white-space:nowrap;font-size:14px}
nav.tabs button:hover{color:var(--navy);background:var(--navy-3)}
nav.tabs button.on{color:var(--navy);font-weight:bold;border-bottom-color:var(--gold)}
main{padding:20px;max-width:1240px;margin:0 auto}
footer.foot{text-align:center;color:var(--muted);font-size:12px;padding:22px 10px 30px}

/* ---------- 元件 ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:18px}
.card>h2{margin:0;padding:13px 16px;font-size:15px;border-bottom:1px solid var(--line);
  background:#fbfcfe;border-radius:var(--r) var(--r) 0 0;display:flex;align-items:center;gap:8px}
.card>h2 .tag{font-weight:normal;font-size:12px;color:var(--muted);margin-left:auto}
.card .body{padding:16px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{background:#f7f9fc;color:var(--muted);font-weight:normal;font-size:12px;white-space:nowrap}
tbody tr:hover{background:#fafcff}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl-scroll{overflow-x:auto}
.mini-btn{padding:4px 10px;border:1px solid var(--line);background:#fff;border-radius:5px;
  cursor:pointer;color:var(--navy-2);white-space:nowrap}
.mini-btn:hover{background:var(--navy-3)}
.mini-btn.danger{color:var(--bad);border-color:#eec4c0}
.mini-btn.danger:hover{background:#fdeceb}
.mini-btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;
  border:1px solid var(--line);background:#f6f8fb;color:var(--muted);white-space:nowrap}
.pill.req{background:#eaf1fb;color:var(--navy-2);border-color:#c8dbf3}
.pill.opt{background:#f3f6fa;color:var(--muted)}
.pill.full{background:#fdeceb;color:var(--bad);border-color:#f6c9c4}
.pill.ok{background:#e9f7ef;color:var(--ok);border-color:#bfe6cd}
.pill.wait{background:#fdf4e3;color:var(--warn);border-color:#f2dfb8}
.pill.no{background:#fdeceb;color:var(--bad);border-color:#f6c9c4}
.bar-sm{height:6px;background:#eceff4;border-radius:999px;overflow:hidden;min-width:70px;display:inline-block;vertical-align:middle}
.bar-sm i{display:block;height:100%;background:var(--navy-2)}
.bar-sm i.full{background:var(--bad)}
.bar-sm i.tight{background:var(--gold)}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:23px;font-weight:bold;color:var(--navy);margin-top:2px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:12px;font-weight:normal;color:var(--muted);margin-left:4px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:14px}
.filters .f{display:flex;flex-direction:column;gap:4px}
.filters label{font-size:12px;color:var(--muted)}
.filters input,.filters select{padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:#fff}
.filters input[type=search]{min-width:200px}
.notice{background:var(--gold-2);border:1px solid #e6d3a2;border-radius:6px;
  padding:10px 12px;font-size:13px;color:#6b5210;margin-bottom:14px}
.notice.blue{background:var(--navy-3);border-color:#c8dbf3;color:#1c3f74}
.empty{text-align:center;color:var(--muted);padding:34px 10px;font-size:13px}
.hint{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.7}
label.fld{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
input.inp,select.inp,textarea.inp{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff}
input.inp:disabled,select.inp:disabled,textarea.inp:disabled{background:#f4f6f9;color:var(--muted)}
input.inp:focus,select.inp:focus,textarea.inp:focus{outline:2px solid var(--navy-3);border-color:var(--navy-2)}
.form-row{margin-bottom:14px}
.form-act{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.btn-s{padding:9px 20px;border:0;border-radius:6px;background:var(--navy);color:#fff;cursor:pointer}
.btn-s:hover{background:var(--navy-2)}
.btn-s[disabled]{opacity:.5;cursor:not-allowed}
.btn-s.line{background:#fff;color:var(--navy);border:1px solid var(--navy-2)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:2px 18px}
.kv .r{display:flex;border-bottom:1px dashed var(--line);padding:8px 0;font-size:13px;gap:8px}
.kv .r .k{color:var(--muted);width:92px;flex:none}

/* ---------- 課表 ---------- */
.tt{width:100%;border-collapse:separate;border-spacing:4px;min-width:760px}
.tt th{background:#eef2f8;color:var(--navy);font-size:12px;padding:7px;border-radius:5px;text-align:center}
.tt th:first-child{width:78px}
.tt td{height:54px;padding:0;border:0;vertical-align:top}
.tt .slot{background:#fbfcfe;border:1px solid var(--line);border-radius:5px;text-align:center;padding:4px 2px;
  color:var(--muted);font-size:11px;line-height:1.35}
.tt .slot b{display:block;color:var(--navy);font-size:12px}
.tt .course{border-radius:5px;padding:5px 7px;color:#fff;font-size:12px;line-height:1.4;
  overflow:hidden;height:100%;cursor:default}
.tt .course b{display:block;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt .course span{display:block;font-size:11px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* ---------- 公告 ---------- */
.ann{border-bottom:1px solid var(--line);padding:12px 2px}
.ann:last-child{border-bottom:0}
.ann .t{font-weight:bold;color:var(--ink);margin-bottom:3px}
.ann .m{font-size:12px;color:var(--muted);margin-bottom:6px}
.ann .c{font-size:13px;color:#3d4757;white-space:pre-wrap}
.ann.pin .t::before{content:"【置頂】";color:var(--bad)}

/* ---------- Modal / Toast ---------- */
#mask{position:fixed;inset:0;background:rgba(18,30,50,.45);display:none;place-items:center;z-index:60;padding:20px}
#mask.on{display:grid}
.modal{background:#fff;border-radius:10px;max-width:460px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{margin:0;padding:15px 18px;font-size:15px;border-bottom:1px solid var(--line)}
.modal .m-body{padding:18px;font-size:13px;max-height:60vh;overflow:auto;line-height:1.8}
.modal .m-act{padding:0 18px 18px;display:flex;gap:10px;justify-content:flex-end}
#toast{position:fixed;left:50%;top:78px;transform:translateX(-50%);z-index:80;display:flex;
  flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.msg{background:#22334f;color:#fff;padding:9px 18px;border-radius:999px;font-size:13px;
  box-shadow:0 6px 20px rgba(0,0,0,.25);animation:pop .18s ease-out}
.msg.err{background:#a5372b}
.msg.ok{background:#1a7f4b}
@keyframes pop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@media (max-width:640px){
  header.bar .semester{display:none}
  header.bar .who{font-size:12px}
  main{padding:12px}
  .card .body{padding:12px}
}
@media print{
  body.printing{background:#fff}
  body.printing header.bar,body.printing nav.tabs,body.printing footer.foot{display:none!important}
  body.printing #app{display:block!important}
  body.printing main{padding:0;max-width:none}
  body.printing .card{border:0;box-shadow:none;margin:0}
  body.printing .hint{display:none}
}
</style>
</head>

/* ------------------------------------------------------- 課程展開 */
function parseSlots(str) {
  const out = [];
  String(str).split(/\s+/).forEach(function (tk) {
    if (!tk) return;
    const p = tk.split(':');
    let d = parseInt(p[0].replace('N', ''), 10);
    let ev = 0;
    if (p[0].charAt(0) === 'N') { ev = d; d = 1; }   // 夜間課程統一排在週一欄
    const a = p[1].split('-');
    const lo = parseInt(a[0], 10), hi = a.length > 1 ? parseInt(a[1], 10) : lo;
    const ps = [];
    for (let i = lo; i <= hi; i++) ps.push(i);
    out.push({ d: d, ev: ev, p: ps });
  });
  return out;
}

const CATALOG = {};
const COURSES = COURSES_RAW.map(function (r) {
  const o = {
    code: r[0], name: r[1], credit: r[2], teacher: r[3], room: r[4],
    slots: parseSlots(r[5]), cap: r[6], taken: r[7], type: r[8], dept: r[9],
    deptName: DEPTS[r[9]] || '通識中心', timeStr: r[5]
  };
  CATALOG[o.code] = o;
  return o;
});
function courseOf(code) { return CATALOG[code] || null; }

/* ---------------------------------------------------------- 色彩 */
const PALETTE = ['#26508f', '#1a7f4b', '#b26a00', '#7b4b9e', '#b0413e',
                 '#0f766e', '#5b6b8c', '#a1552a', '#3d6b1f', '#9e2a63'];
function colorOf(code) {
  let h = 0, i;
  for (i = 0; i < code.length; i++) h = (h * 31 + code.charCodeAt(i)) >>> 0;
  return PALETTE[h % PALETTE.length];
}

/* ---------------------------------------------------- 工具函式 */
function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function termLabel(id) {
  const t = TERMS.filter(function (x) { return x.id === id; })[0];
  return t ? t.label : id;
}
function termOf(id) { return TERMS.filter(function (x) { return x.id === id; })[0] || null; }
function nowStamp() {
  const d = new Date(), p = function (n) { return n < 10 ? '0' + n : '' + n; };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
    ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function uid(prefix) { return prefix + Date.now().toString(36).toUpperCase(); }

/* 時段 */
function slotText(o) {
  return o.slots.map(function (s) {
    const t = s.ev ? '夜間' : '週' + DAYS[s.d - 1];
    return t + '第' + s.p.join('、') + '節';
  }).join('／');
}
function hasConflict(a, b) {
  return a.slots.some(function (sa) {
    return b.slots.some(function (sb) {
      return sa.d === sb.d && sa.ev === sb.ev && sa.p.some(function (p) { return sb.p.indexOf(p) >= 0; });
    });
  });
}
function clashList(list, code) {
  const me0 = courseOf(code);
  return list.filter(function (c) { return c.code !== code && hasConflict(c, me0); }).map(function (c) { return c.code; });
}

/* 名額（含各生自行加選之影響） */
function seatUsed(c) {
  let n = c.taken;
  Object.keys(db.over).forEach(function (id) {
    const u = db.users[id];
    if (u && u.extra[c.code]) n += u.extra[c.code];
  });
  return n;
}
function seatLeft(c) { return c.cap - seatUsed(c); }
function isFull(c) { return seatLeft(c) <= 0; }

/* 學分 */
function pickedCourses(term) {
  const list = me.u.picked.filter(function (c) { return !!courseOf(c); });
  return list.map(courseOf);
}
function creditOf(list) {
  return list.reduce(function (a, c) { return a + c.credit; }, 0);
}
function takenCodes(term) {
  const g = me.u.grades[term] || [], out = {};
  g.forEach(function (r) { out[r[0]] = 1; });
  return out;
}
function allPassedCodes() {
  const out = {};
  TERMS.forEach(function (t) {
    Object.keys(takenCodes(t.id)).forEach(function (k) { out[k] = 1; });
  });
  return out;
}

/* 成績 */
function levelOf(score) {
  if (score === null || score === undefined) return '通過';
  if (score >= 90) return 'A';
  if (score >= 85) return 'A-';
  if (score >= 80) return 'B+';
  if (score >= 75) return 'B';
  if (score >= 70) return 'C+';
  if (score >= 65) return 'C';
  if (score >= 60) return 'D';
  if (score >= 50) return 'E';
  return 'F';
}
function avgOf(rows) {
  let s = 0, c = 0;
  rows.forEach(function (r) {
    if (r[3] === null || r[3] === undefined) return;
    s += r[3] * r[2]; c += r[2];
  });
  return c ? s / c : null;
}
function creditsOf(rows) {
  return rows.reduce(function (a, r) { return a + (r[3] === null ? 0 : r[2]); }, 0);
}

/* 未修必修 */
function pendingRequired() {
  const done = allPassedCodes();
  const cur = {}; pickedCourses().forEach(function (c) { done[c.code] = 1; });
  return me.u.required.filter(function (code) { return !done[code]; });
}

function dueInfo() {
  const m = String(RULES.addDropDue).match(/(\d+)-(\d+)-(\d+) (\d+):(\d+)/);
  const end = new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]);
  const diff = end.getTime() - Date.now();
  return { end: end, left: diff, days: Math.ceil(diff / 86400000) };
}
function statBox(k, v, unit) {
  return '<div class="stat"><div class="k">' + k + '</div><div class="v">' + v +
    (unit ? '<small>' + unit + '</small>' : '') + '</div></div>';
}

/* 選課／退課 */
function doPick(code) {
  const c = courseOf(code);
  if (!c) return;
  const d = dueInfo();
  if (d.left <= 0) { toast('加選／退選已截止，無法選課。', 'err'); return; }
  if (me.u.picked.indexOf(code) >= 0) { toast('此課程已選修。', 'err'); return; }
  if (isFull(c)) { toast('名額已滿（' + seatUsed(c) + '/' + c.cap + '），無法選課。', 'err'); return; }

  const done = allPassedCodes();
  if (done[code]) {
    toast('此科已修及格（' + done[code] + '），不得重複選修；如需重修請洽課務組。', 'err');
    return;
  }

  const list = pickedCourses();
  const clash = clashList(list, code);
  const newCr = creditOf(list) + c.credit;
  if (newCr > RULES.creditMax) {
    toast('選課後學分將達 ' + newCr + ' 學分，超過上限 ' + RULES.creditMax + ' 學分。', 'err');
    return;
  }

  let html = '<p><b>' + esc(c.code) + ' ' + esc(c.name) + '</b>（' + c.credit + ' 學分）</p>';
  html += '<p>教師：' + esc(c.teacher) + '　教室：' + esc(c.room) + '<br>時間：' + esc(slotText(c)) + '</p>';
  html += '<p>選課後學分：' + creditOf(list) + ' → <b>' + newCr + '</b> 學分（上限 ' + RULES.creditMax + '）</p>';
  if (clash.length) {
    html += '<div class="notice" style="margin:10px 0 0">⚠ 與下列已選課程時段重疊：<b>' +
      esc(clash.join('、')) + '</b></div>';
  }
  if (newCr > RULES.creditOver && !me.u.overReason) {
    html += '<div class="notice" style="margin:10px 0 0">⚠ 選課後將達超學分門檻，請記得於本頁下方登記「超學分理由」。</div>';
  }

  openModal('確認選課', html, function () {
    me.u.picked.push(code);
    me.u.extra[code] = (me.u.extra[code] || 0);
    saveDB();
    toast('已選修 ' + c.name + '（' + c.code + '）', 'ok');
    go('reg');
  });
}

function doDrop(code) {
  const c = courseOf(code);
  if (!c) return;
  if (dueInfo().left <= 0) { toast('退選已截止。', 'err'); return; }
  const req = me.u.required.indexOf(code) >= 0;
  openModal('確認退課', '<p>確定要退掉 <b>' + esc(c.name) + '</b>（' + esc(code) + '）嗎？</p>' +
    '<p>退課後學分：' + creditOf(pickedCourses()) + ' → <b>' + (creditOf(pickedCourses()) - c.credit) + '</b> 學分</p>' +
    (req ? '<div class="notice" style="margin:10px 0 0;color:#8c2b1f;background:#fdeceb;border-color:#f6c9c4">' +
      '⚠ 此科目為系所必修科目，退選後須另行補修，請先確認。</div>' : ''),
    function () {
      me.u.picked = me.u.picked.filter(function (x) { return x !== code; });
      if (me.u.extra[code]) delete me.u.extra[code];
      saveDB();
      toast('已退掉 ' + c.name, 'ok');
      go('reg');
    }, '確定退課');
}

function historyTable() {
  let all = [], fails = 0;
  const terms = TERMS.filter(function (t) { return me.u.grades[t.id] && me.u.grades[t.id].length; });
  terms.forEach(function (t) {
    (me.u.grades[t.id] || []).forEach(function (r) {
      if (r[3] === null) return;
      all.push({ t: t.id, c: r[0], n: r[1], cr: r[2], sc: r[3] });
      if (r[3] < 60) fails++;
    });
  });
  const avgAll = all.length ? all.reduce(function (a, r) { return a + r.sc * r.cr; }, 0) /
    all.reduce(function (a, r) { return a + r.cr; }, 0) : 0;

  let h = '<div class="card"><h2>📚 歷年修業進度<span class="tag">' + terms.length + ' 個學期</span></h2><div class="body">';
  h += '<div class="grid g4" style="margin-bottom:14px">';
  h += statBox('累計修讀學分', all.reduce(function (a, r) { return a + r.cr; }, 0), '學分');
  h += statBox('累計平均', avgAll ? avgAll.toFixed(2) : '—', avgAll ? '分' : '');
  h += statBox('累計不及格', fails, fails ? '門' : '門');
  h += statBox('累計修課', all.length, '門');
  h += '</div>';
  h += '<div class="tbl-scroll"><table><thead><tr><th>學期</th><th>科目代號</th><th>科目名稱</th>' +
    '<th class="num">學分</th><th class="num">成績</th><th class="num">等第</th></tr></thead><tbody>';
  if (!all.length) {
    h += '<tr><td colspan="6"><div class="empty">尚無歷史成績紀錄。</div></td></tr>';
  } else {
    all.forEach(function (r) {
      h += '<tr><td>' + esc(r.t) + '</td><td>' + esc(r.c) + '</td><td>' + esc(r.n) +
        '</td><td class="num">' + r.cr + '</td><td class="num"' +
        (r.sc < 60 ? ' style="color:var(--bad);font-weight:bold"' : '') + '>' + r.sc +
        '</td><td class="num">' + levelOf(r.sc) + '</td></tr>';
    });
  }
  h += '</tbody></table></div>';
  h += '<div class="hint">＊累計資料涵蓋本系統已建立之歷年紀錄；正式學位授予資格須以教務處之審核結果為準。</div>';
  h += '</div></div>';
  return h;
}

function dayDiff(a, b) {
  return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000) + 1;
}
function judgeLeave(type, days) {
  const rules = RULES.leaveRules.filter(function (r) { return r.type === type; })
    .sort(function (a, b) { return a.max - b.max; });
  for (let i = 0; i < rules.length; i++) {
    if (days <= rules[i].max) return { status: rules[i].status, who: rules[i].who };
  }
  return { status: 'pending', who: '待系主任審核' };
}
const ST_TXT = { approved: '已核准', pending: '待審核', rejected: '未核准' };
const ST_CLS = { approved: 'ok', pending: 'wait', rejected: 'no' };

VIEWS.leave = function () {
  const ls = me.u.leaves.slice().sort(function (a, b) { return a.applyAt < b.applyAt ? 1 : -1; });

  let h = '';
  h += '<div class="grid g4" style="margin-bottom:18px">';

    esc(RULES.leaveTypes[0].need) + '</div></div>';

    '其餘情形送系上輔導教師／系主任審核。送出後如需撤回，請於「待審核」狀態下按「撤回」。</div>';

BIND.leave = function () {
  const type = $('#lvType'), start = $('#lvStart'), end = $('#lvEnd');
  if (!type) return;
  const days = $('#lvDays');

  const calc = function () {
    if (!start.value || !end.value) { days.value = '0 天（自動計算）'; return; }
    if (end.value < start.value) { days.value = '日期錯誤'; return; }
    days.value = dayDiff(start.value, end.value) + ' 天（含首日）';
  };
  start.addEventListener('change', calc);
  end.addEventListener('change', calc);
  type.addEventListener('change', function () {
    const t = RULES.leaveTypes.filter(function (x) { return x.v === type.value; })[0];
    $('#lvNeed').textContent = t ? t.need : '';
  });

  $('#lvReset').addEventListener('click', function () {
    start.value = ''; end.value = $('#lvReason').value = ''; calc();
  });

  $('#lvAdd').addEventListener('click', function () {
    const t = type.value, s = start.value, e = end.value;
    const reason = $('#lvReason').value.trim();
    if (!s || !e) { toast('請填寫請假起訖日期。', 'err'); return; }
    if (e < s) { toast('結束日期不可早於開始日期。', 'err'); return; }
    if (reason.length < 5) { toast('請填寫事由（至少 5 個字）。', 'err'); return; }
    const n = dayDiff(s, e);
    if (n > 30) { toast('單次請假不得超過 30 日，請洽系上承辦人。', 'err'); return; }

    const j = judgeLeave(t, n);
    const need = RULES.leaveTypes.filter(function (x) { return x.v === t; })[0];
    const confirmHTML = '<p><b>' + esc(t) + '　' + esc(s) + ' ~ ' + esc(e) + '（' + n + ' 天）</b></p>' +
      '<p>事由：' + esc(reason) + '</p>' +
      '<div class="notice" style="margin:10px 0 0">應繳證明：' + esc(need.need) + '<br>' +
      '審核結果將為：<b>' + ST_TXT[j.status] + '</b>（' + esc(j.who) + '）</div>';
    openModal('確認送出假單', confirmHTML, function () {
      me.u.leaves.push({
        id: uid('L'), type: t, start: s, end: e, days: n, reason: reason,
        status: j.status, applyAt: nowStamp(), who: j.who, memo: ''
      });
      saveDB();
      toast(j.status === 'approved' ? '假單已送出並自動核准' : '假單已送出，等待審核', 'ok');
      go('leave');
    }, '確認送出');
  });

  $$('#view [data-cancel]').forEach(function (b) {
    b.addEventListener('click', function () {
      const id = b.dataset.cancel;
      openModal('確認撤回', '<p>確定要撤回假單 <b>' + esc(id) + '</b> 嗎？撤回後將無法復原，須重新填寫。</p>',
        function () {
          me.u.leaves = me.u.leaves.filter(function (l) { return l.id !== id; });
          saveDB();
          toast('假單 ' + id + ' 已撤回', 'ok');
          go('leave');
        }, '確定撤回');
    });
  });
};

    kvRow('系所', DEPTS[u.deptCode]) + kvRow('班級', u.cls) +
    kvRow('學年', (115 - parseInt(me.id.slice(0, 3), 10) + 1) + ' 年級') +
    kvRow('狀態', '在學（正常註冊）') + kvRow('入學年月', (parseInt(me.id.slice(0, 3), 10) - 1911) + ' 年 9 月');
  h += '</div><div class="hint">＊學號、姓名、系所、班級等資料如需異動，請至註冊課務組填寫「學籍異動申請表」。</div>';
  h += '</div></div>';

  h += '<div class="card"><h2>📞 聯絡方式（可修改）</h2><div class="body">';
  h += '<div class="form-row"><label class="fld">行動電話</label><input class="inp" id="pPhone" value="' + esc(u.phone) + '"></div>';
  h += '<div class="form-row"><label class="fld">電子郵件</label><input class="inp" id="pMail" value="' + esc(u.email) + '"></div>';
  h += '<div class="form-row"><label class="fld">現居地址</label><input class="inp" id="pAddr" value="' + esc(u.addr) + '"></div>';
  h += '<div class="grid g2">';
  h += '<div class="form-row"><label class="fld">緊急聯絡人關係</label><select class="inp" id="pRel">' +
    ['父親', '母親', '兄弟', '姊妹', '監護人', '其他'].map(function (v) {
      return '<option' + (u.contact.rel === v ? ' selected' : '') + '>' + v + '</option>';
    }).join('') + '</select></div>';
  h += '<div class="form-row"><label class="fld">緊急聯絡人姓名</label><input class="inp" id="pCname" value="' + esc(u.contact.name) + '"></div>';
  h += '</div>';
  h += '<div class="form-row"><label class="fld">緊急聯絡人電話</label><input class="inp" id="pCphone" value="' + esc(u.contact.phone) + '"></div>';
  h += '<div class="form-act"><button class="btn-s" id="pSave">儲存聯絡方式</button>' +
    '<button class="btn-s line" id="pReset">還原</button></div>';
  h += '<div class="hint">聯絡資訊將用於緊急事件聯絡、獎學金審查與寄送成績單，請確認為最新資料。</div>';
  h += '</div></div>';
  h += '</div>';

  h += '<div class="card"><h2>🔑 修改密碼</h2><div class="body">';
  h += '<div class="grid g2">';
  h += '<div class="form-row"><label class="fld">目前密碼</label><input type="password" class="inp" id="oPwd" autocomplete="off"></div>';
  h += '<div class="form-row"><label class="fld">新密碼</label><input type="password" class="inp" id="nPwd" autocomplete="off"></div>';
  h += '</div>';
  h += '<div class="form-row"><label class="fld">確認新密碼</label><input type="password" class="inp" id="nPwd2" autocomplete="off"></div>';
  h += '<div class="form-act"><button class="btn-s" id="pwdSave">變更密碼</button></div>';
  h += '<div class="hint">密碼規則：至少 8 個字元，且須同時包含英文與數字。變更後請以新密碼重新登入。</div>';
  h += '</div></div>';

  h += '<div class="card"><h2>📊 我的學籍摘要</h2><div class="body"><div class="grid g4">';
  h += statBox('本學期學分', creditOf(pickedCourses()), '學分');
  h += statBox('已修學期', TERMS.filter(function (t) { return me.u.grades[t.id]; }).length, '學期');
  h += statBox('累計修讀學分', cumulativeCredits(), '學分');
  h += statBox('待修必修', pendingRequired().length, '門');
  h += '</div></div></div>';

  h += '<div class="card"><h2>⚙ 系統設定</h2><div class="body">';
  h += '<p style="margin:0 0 10px;font-size:13px;color:var(--muted)">資料儲存方式：' +
    (LS.ok ? '瀏覽器本機儲存（localStorage），關閉瀏覽器後仍會保留。' : '本機儲存被瀏覽器限制，目前為暫存模式，重新開啟將恢復初始資料。') +
    '</p>';
  h += '<div class="form-act"><button class="btn-s line" id="resetAll">重設所有資料</button></div>';
  h += '<div class="hint">重設後，選課、假單與個人資料異動將回復為初始示範內容。</div>';
  h += '</div></div>';
  return h;
};

function cumulativeCredits() {
  let n = 0;
  TERMS.forEach(function (t) {
    (me.u.grades[t.id] || []).forEach(function (r) { if (r[3] !== null) n += r[2]; });
  });
  return n;
}

BIND.me = function () {
  const save = $('#pSave');
  if (save) {
    save.addEventListener('click', function () {
      const phone = $('#pPhone').value.trim(), mail = $('#pMail').value.trim();
      const cphone = $('#pCphone').value.trim();
      if (!/^09\d{8}$/.test(phone.replace(/-/g, ''))) { toast('行動電話格式不正確（應為 09 開頭 10 碼）。', 'err'); return; }
      if (!/^09\d{8}$/.test(cphone.replace(/-/g, ''))) { toast('緊急聯絡人電話格式不正確。', 'err'); return; }
      if (mail && mail.indexOf('@') < 0) { toast('電子郵件格式不正確。', 'err'); return; }
      me.u.phone = phone; me.u.email = mail;
      me.u.addr = $('#pAddr').value.trim();
      me.u.contact = { rel: $('#pRel').value, name: $('#pCname').value.trim(), phone: cphone };
      saveDB();
      toast('聯絡方式已更新', 'ok');
      go('me');
    });
    $('#pReset').addEventListener('click', function () { go('me'); toast('已還原為儲存前資料'); });
  }
  const pb = $('#pwdSave');
  if (pb) {
    pb.addEventListener('click', function () {
      const o = $('#oPwd').value, n = $('#nPwd').value, n2 = $('#nPwd2').value;
      if (o !== me.u.pwd) { toast('目前密碼不正確。', 'err'); return; }
      if (n.length < 8) { toast('新密碼至少 8 個字元。', 'err'); return; }
      if (!/[a-zA-Z]/.test(n) || !/\d/.test(n)) { toast('新密碼須同時包含英文與數字。', 'err'); return; }
      if (n !== n2) { toast('兩次輸入的新密碼不一致。', 'err'); return; }
      openModal('確認變更密碼',
        '<p>密碼已變更，即將自動登出，請使用新密碼重新登入。</p>', function () {
          me.u.pwd = n; saveDB();
          toast('密碼已變更，請重新登入', 'ok');
          setTimeout(showLogin, 700);
        }, '變更並登出');
    });
  }
  const rb = $('#resetAll');
  if (rb) {
    rb.addEventListener('click', function () {
      openModal('重設所有資料',
        '<p>此操作將清除本機所有選課、假單與個人資料異動，並回復為初始示範內容。</p>' +
        '<p style="color:var(--bad)">確定要繼續嗎？</p>', function () {
          resetDB(); me = { id: me.id, u: db.users[me.id] };
          toast('已重設為初始資料', 'ok');
          go('me');
        }, '確定重設');
    });
  }
};

/* =========================================================================
   啟動
   ========================================================================= */
init();
</script>
</body>
</html>
