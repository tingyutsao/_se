# =============================================================================
#  Nginx 設定：靜態網站 + 反向代理
#  瀏覽器只會連到 nginx，由 nginx 依路徑把請求轉到對應的微服務容器。
#
#    /                -> 靜態檔案 /usr/share/nginx/html
#    /api/node/...    -> http://node-api:3000/...
#    /api/python/...  -> http://python-api:8000/...
#    /api/rust/...    -> http://rust-api:8080/...
#
#  注意：service 名稱（node-api…）由 Docker Compose 的內部 DNS 解析成容器 IP。
# =============================================================================

# 上游服務（名稱對應 docker-compose.yml 的 service 名稱）
upstream node_api   { server node-api:3000; }
upstream python_api { server python-api:8000; }
upstream rust_api   { server rust-api:8080; }

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # 關閉版本號，減少指紋資訊
    server_tokens off;

    # 壓縮靜態資源
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 512;

    # ---------------------------------------------------------------------
    # 健康檢查（給 Docker HEALTHCHECK 用）
    # ---------------------------------------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---------------------------------------------------------------------
    # 反向代理：Node.js API
    #   /api/node/info -> http://node-api:3000/info
    # ---------------------------------------------------------------------
    location /api/node/ {
        proxy_pass http://node_api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ---------------------------------------------------------------------
    # 反向代理：Python API
    # ---------------------------------------------------------------------
    location /api/python/ {
        proxy_pass http://python_api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------------------------------------------------------------
    # 反向代理：Rust API
    # ---------------------------------------------------------------------
    location /api/rust/ {
        proxy_pass http://rust_api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------------------------------------------------------------
    # 前端靜態網站（SPA fallback）
    # ---------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|svg|png|jpg|ico|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
    }
}
